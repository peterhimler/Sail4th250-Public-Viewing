<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sail4th 250 — Free Public Viewing Areas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #0a1628;
    --gold: #c9a84c;
    --cream: #f5f0e8;
  }
  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--navy);
    color: var(--cream);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--navy);
    border-bottom: 2px solid var(--gold);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }
  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  .header-left p {
    font-size: 0.78rem;
    color: #aab;
    margin-top: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .header-right {
    font-size: 0.72rem;
    color: #8899aa;
    text-align: right;
    line-height: 1.6;
  }
  #map { flex: 1; width: 100%; }
  .legend {
    background: rgba(10, 22, 40, 0.95);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 14px 16px;
    font-family: 'Source Sans 3', sans-serif;
    min-width: 220px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .legend h3 {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 0.85rem;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid rgba(201,168,76,0.3);
    padding-bottom: 6px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;
    font-size: 0.78rem;
    color: var(--cream);
    line-height: 1.3;
  }
  .legend-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .legend-line {
    width: 24px; height: 3px;
    flex-shrink: 0;
    border-radius: 2px;
  }
  .legend-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .legend-note {
    font-size: 0.7rem;
    color: #8899aa;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
    line-height: 1.4;
  }
  .leaflet-popup-content-wrapper {
    background: var(--navy);
    border: 1px solid var(--gold);
    border-radius: 6px;
    color: var(--cream);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .leaflet-popup-tip { background: var(--navy); }
  .leaflet-popup-content {
    margin: 14px 16px;
    font-family: 'Source Sans 3', sans-serif;
  }
  .popup-title {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 0.95rem;
    margin-bottom: 5px;
    line-height: 1.3;
  }
  .popup-tag {
    display: inline-block;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .popup-body { font-size: 0.78rem; color: #ccd; line-height: 1.5; }
  .popup-cost { margin-top: 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>&#9965; Sail4th 250 &mdash; Where to Watch for Free</h1>
    <p>Public Viewing Areas &middot; July 3 &amp; 4, 2026 &middot; Port of New York &amp; New Jersey</p>
  </div>
  <div class="header-right">Click any marker<br>for details</div>
</header>
<div id="map"></div>
<script>
  var map = L.map('map', { center: [40.74, -73.97], zoom: 12 });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  var C = {
    july4:    '#1a8a4c',
    july3:    '#e67e22',
    both:     '#4a90d9',
    staging:  '#c0392b',
    gov:      '#8e44ad'
  };

  function makeIcon(color, size) {
    size = size || 14;
    return L.divIcon({
      className: '',
      html: '<div style="width:' + size + 'px;height:' + size + 'px;background:' + color + ';border:2.5px solid rgba(255,255,255,0.7);border-radius:50%;box-shadow:0 0 8px ' + color + '99;"></div>',
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2 - 4]
    });
  }

  function makeStarIcon(color) {
    return L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;background:' + color + ';border:2.5px solid rgba(255,255,255,0.85);border-radius:3px;transform:rotate(45deg);box-shadow:0 0 10px ' + color + 'cc;"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -14]
    });
  }

  function makePopup(title, tag, tagColor, desc, cost) {
    return '<div class="popup-title">' + title + '</div>' +
      '<div><span class="popup-tag" style="background:' + tagColor + '22;color:' + tagColor + ';border:1px solid ' + tagColor + '55">' + tag + '</span></div>' +
      '<div class="popup-body">' + desc + '</div>' +
      '<div class="popup-cost" style="color:' + tagColor + '">' + cost + '</div>';
  }

  // ── JULY 4 HUDSON RIVER SITES ─────────────────────────────────────────────
  var july4Sites = [
    { lat:40.7420, lng:-74.0103, name:"Little Island (Pier 55)",
      desc:"The Hudson's most striking park — a floating island right on the water. Unobstructed views of the tall ships as they pass. Free entry.",
      cost:"Free &middot; Open 6AM-midnight" },
    { lat:40.7772, lng:-73.9895, name:"Riverside Park South",
      desc:"Hudson River waterfront park from 59th to 72nd St. Bike and jogging paths right along the water with direct views of the July 4 parade.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7886, lng:-73.9824, name:"Hudson River Waterfront Greenway (Upper West Side)",
      desc:"Long continuous waterfront path heading south from the GWB. Watch tall ships sail down the Hudson from multiple vantage points.",
      cost:"Free &middot; Open all day" },
    { lat:40.7648, lng:-74.0002, name:"Hudson River Park — Piers 86-92 Area",
      desc:"The official tall ship staging area. Surrounding Hudson River Park piers offer unobstructed waterfront views of the fleet.",
      cost:"Free &middot; Open all day" },
    { lat:40.7342, lng:-74.0113, name:"Pier 46 — Hudson River Park",
      desc:"Grassy pier with stunning Hudson River views. One of the most popular summer spots in NYC — arrive early on July 4.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7331, lng:-74.0125, name:"Pier 45 — Hudson River Park",
      desc:"Open lawn with benches and waterfront access. Great mid-route vantage as tall ships head south.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7211, lng:-74.0130, name:"Pier 26 — Hudson River Park (Tribeca)",
      desc:"Waterfront park near Tribeca with open lawn and river access. Ships pass close by on their southward route.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7053, lng:-74.0188, name:"Robert F. Wagner Jr. Park",
      desc:"Panoramic harbor views and Statue of Liberty sightlines at the southern tip of Manhattan.",
      cost:"Free &middot; Open 24 hours" },
    { lat:40.7029, lng:-74.0154, name:"The Battery (Battery Park)",
      desc:"Iconic lower Manhattan waterfront park at the harbor entry. Tall ships pass directly by on their way north up the Hudson.",
      cost:"Free &middot; Open 6AM-1AM" }
  ];

  july4Sites.forEach(function(s) {
    L.marker([s.lat, s.lng], { icon: makeIcon(C.july4) })
      .addTo(map)
      .bindPopup(makePopup(s.name, "July 4 — Tall Ship Parade", C.july4, s.desc, s.cost));
  });

  // ── JULY 3 EAST RIVER SITES ───────────────────────────────────────────────
  var july3Sites = [
    { lat:40.7801, lng:-73.9274, name:"Astoria Park (Hell Gate)",
      desc:"Prime vantage right at Hell Gate — where the Class B parade begins. The park sits on the East River with unobstructed views as ships set sail. The Hell Gate Bridge frames the scene perfectly.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7681, lng:-73.9297, name:"Hallets Cove Waterfront (Astoria)",
      desc:"Small waterfront green space just south of Hell Gate. Ships pass close to the Queens shoreline early in the parade route.",
      cost:"Free &middot; Open all day" },
    { lat:40.7751, lng:-73.9437, name:"Carl Schurz Park (Upper East Side)",
      desc:"Beautiful east-side Manhattan park right on the East River at 86th St. Direct views of ships heading south from Hell Gate.",
      cost:"Free &middot; Open 6AM-midnight" },
    { lat:40.7691, lng:-73.9495, name:"John Jay Park (Upper East Side)",
      desc:"East River park at 77th St with good sightlines south along the river. Solid mid-route vantage as ships pass through Midtown waters.",
      cost:"Free &middot; Open 7AM-10PM" },
    { lat:40.7575, lng:-73.9496, name:"Roosevelt Island — Southern Tip",
      desc:"Four Freedoms Park offers dramatic views down the East River. Class B ships pass on both sides of the island. Access via free tram or F train.",
      cost:"Free &middot; Tram $2.90 each way" },
    { lat:40.7423, lng:-73.9607, name:"Hunters Point South Park (Long Island City)",
      desc:"Stunning Queens-side waterfront park with sweeping East River views. Ships pass directly in front. The cantilevered overlook is spectacular.",
      cost:"Free &middot; Open 6AM-10PM" },
    { lat:40.7421, lng:-73.9605, name:"Gantry Plaza State Park (Long Island City)",
      desc:"Iconic Queens waterfront park featuring the historic Pepsi-Cola sign and direct East River access. One of the best skyline views in NYC.",
      cost:"Free &middot; Open 8AM-10PM" },
    { lat:40.7282, lng:-73.9757, name:"East River Park (Lower East Side)",
      desc:"Long waterfront park on the Manhattan side. Ships pass directly by heading south. Multiple vantage points along the 1.5-mile esplanade.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7056, lng:-74.0015, name:"South Street Seaport / Pier 17",
      desc:"The finish line of the July 3 Class B parade. The Seaport plaza and Fulton Street promenade are free — watch the ships arrive from the waterfront boardwalk.",
      cost:"Free &middot; Open 24 hours (plaza)" }
  ];

  july3Sites.forEach(function(s) {
    L.marker([s.lat, s.lng], { icon: makeIcon(C.july3) })
      .addTo(map)
      .bindPopup(makePopup(s.name, "July 3 — Class B Parade", C.july3, s.desc, s.cost));
  });

  // ── BOTH PARADES ──────────────────────────────────────────────────────────
  var bothSites = [
    { lat:40.7022, lng:-73.9959, name:"Brooklyn Bridge Park",
      desc:"85-acre waterfront park with 1.3 miles of East River frontage. One of the best vantage points in the metro — ships on both parades are visible.",
      cost:"Free &middot; Open 6AM-1AM" },
    { lat:40.7030, lng:-73.9956, name:"Brooklyn Bridge Park — Pier 1",
      desc:"The northern tip of Brooklyn Bridge Park. Up-close harbor views and Statue of Liberty sightlines. Ideal for both July 3 and July 4 parades.",
      cost:"Free &middot; Open 24 hours" }
  ];

  bothSites.forEach(function(s) {
    L.marker([s.lat, s.lng], { icon: makeIcon(C.both, 16) })
      .addTo(map)
      .bindPopup(makePopup(s.name, "Both Parades", C.both, s.desc, s.cost));
  });

  // ── GOVERNORS ISLAND ──────────────────────────────────────────────────────
  L.marker([40.6885, -74.0185], { icon: makeIcon(C.gov, 16) })
    .addTo(map)
    .bindPopup(makePopup(
      "Governors Island",
      "July 4 — Best Harbor View",
      C.gov,
      "Sits in the middle of the harbor with 360-degree views. Picnic Point faces the Statue of Liberty and is spectacular for the July 4 parade.",
      "Ferry required — $5 round trip &middot; Open 10AM-7PM (weekends)"
    ));

  // ── ROUTE START/END MARKERS ───────────────────────────────────────────────
  var stagingPoints = [
    { lat:40.8517, lng:-73.9527, name:"GWB — July 4 Northern Terminus",
      desc:"The Tall Ship Parade of Sail concludes here after traveling north up the Hudson River from the Verrazzano." },
    { lat:40.6074, lng:-74.0500, name:"Verrazzano-Narrows Bridge — July 4 Route Start",
      desc:"The International Parade of Sail begins here at 9:30 AM on July 4, with ships sailing north up the Hudson to the GWB." },
    { lat:40.7801, lng:-73.9274, name:"Hell Gate — July 3 Route Start",
      desc:"The Class B Tall Ship Parade sets sail from Hell Gate, heading south down the East River to South Street Seaport. Astoria Park is the best viewing spot for the departure." },
    { lat:40.7056, lng:-74.0015, name:"South Street Seaport — July 3 Route End",
      desc:"The Class B Tall Ship Parade concludes at South Street Seaport. The plaza and Fulton Street promenade are free and publicly accessible." }
  ];

  stagingPoints.forEach(function(s) {
    L.marker([s.lat, s.lng], { icon: makeStarIcon(C.staging) })
      .addTo(map)
      .bindPopup('<div class="popup-title">' + s.name + '</div><div class="popup-body">' + s.desc + '</div>');
  });

  // ── JULY 4 ROUTE: Verrazzano → Upper Bay → Hudson (Manhattan shore) → GWB ─
  var july4Route = [
    [40.6074, -74.0500],
    [40.6300, -74.0520],
    [40.6500, -74.0480],
    [40.6700, -74.0400],
    [40.6885, -74.0320],
    [40.7000, -74.0220],
    [40.7100, -74.0180],
    [40.7200, -74.0160],
    [40.7330, -74.0140],
    [40.7450, -74.0130],
    [40.7560, -74.0100],
    [40.7700, -74.0020],
    [40.7900, -73.9900],
    [40.8200, -73.9680],
    [40.8517, -73.9527]
  ];

  L.polyline(july4Route, {
    color: C.july4, weight: 3, opacity: 0.8, dashArray: '8, 6'
  }).addTo(map).bindTooltip("July 4 Tall Ship Route (approx.)", { sticky: true });

  // ── JULY 3 ROUTE: Hell Gate → East River → South Street Seaport ───────────
  var july3Route = [
    [40.7801, -73.9274],
    [40.7750, -73.9320],
    [40.7681, -73.9380],
    [40.7575, -73.9480],
    [40.7450, -73.9580],
    [40.7350, -73.9650],
    [40.7282, -73.9720],
    [40.7200, -73.9760],
    [40.7130, -73.9780],
    [40.7056, -73.9980]
  ];

  L.polyline(july3Route, {
    color: C.july3, weight: 3, opacity: 0.8, dashArray: '8, 6'
  }).addTo(map).bindTooltip("July 3 Class B Route (approx.)", { sticky: true });

  // ── LEGEND ────────────────────────────────────────────────────────────────
  var legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function() {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML =
      '<h3>Viewing Key</h3>' +
      '<div class="legend-item"><div class="legend-dot" style="background:' + C.july4 + '"></div>' +
      '<span><strong style="color:' + C.july4 + '">July 4</strong> &mdash; Tall Ship Parade<br><span style="color:#8899aa;font-size:0.72rem">Verrazzano &rarr; Hudson &rarr; GWB &middot; Free</span></span></div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:' + C.july3 + '"></div>' +
      '<span><strong style="color:' + C.july3 + '">July 3</strong> &mdash; Class B Parade<br><span style="color:#8899aa;font-size:0.72rem">Hell Gate &rarr; East River &rarr; Seaport &middot; Free</span></span></div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:' + C.both + '"></div>' +
      '<span><strong style="color:' + C.both + '">Both Parades</strong> &mdash; Brooklyn Bridge Park<br><span style="color:#8899aa;font-size:0.72rem">Best overall vantage &middot; Free</span></span></div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:' + C.gov + '"></div>' +
      '<span><strong style="color:' + C.gov + '">Governors Island</strong><br><span style="color:#8899aa;font-size:0.72rem">360&deg; harbor views &middot; $5 ferry</span></span></div>' +
      '<div class="legend-section">' +
      '<div class="legend-item"><div class="legend-dot" style="background:' + C.staging + ';border-radius:3px;transform:rotate(45deg)"></div>' +
      '<span style="color:#aab">Route start / end points</span></div>' +
      '<div class="legend-item"><div class="legend-line" style="background:' + C.july4 + ';opacity:0.8"></div>' +
      '<span style="color:#aab">Approximate parade routes</span></div></div>' +
      '<div class="legend-note">&#9875; Routes are approximate. Confirm final paths with sail4th.us closer to the event.</div>';
    return div;
  };
  legend.addTo(map);

  // ── INFO CARD ─────────────────────────────────────────────────────────────
  var info = L.control({ position: 'topright' });
  info.onAdd = function() {
    var div = L.DomUtil.create('div', 'legend');
    div.style.maxWidth = '200px';
    div.innerHTML =
      '<h3>About This Map</h3>' +
      '<div style="font-size:0.74rem;color:#ccd;line-height:1.5">' +
      'All <span style="color:' + C.july4 + '">&#9679;</span> and <span style="color:' + C.july3 + '">&#9679;</span> sites are <strong>free</strong> public parks and waterfront areas.<br><br>' +
      '<span style="color:' + C.gov + '">&#9679;</span> Governors Island requires a $5 round-trip ferry &mdash; worth it for unmatched 360&deg; harbor views.<br><br>' +
      'Click any marker for details.</div>';
    return div;
  };
  info.addTo(map);

</script>
</body>
</html>
