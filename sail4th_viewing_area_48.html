<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --navy:#0a1628; --gold:#c9a84c; --cream:#f5f0e8; }
  body { font-family:"Source Sans 3",sans-serif; background:var(--navy); color:var(--cream); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--navy); border-bottom:2px solid var(--gold); padding:8px 20px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; z-index:1000; }
  .header-logo { height:72px; width:auto; display:block; }
  .header-center { padding-left:16px; }
  .header-supertitle { font-size:0.68rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.14em; margin-bottom:2px; font-weight:600; }
  .header-center h1 { font-family:"Playfair Display",serif; font-size:1.2rem; color:var(--gold); letter-spacing:0.04em; line-height:1.2; }
  .header-center p { font-size:0.75rem; color:#aab; margin-top:3px; letter-spacing:0.05em; text-transform:uppercase; }
  .header-right { font-size:0.72rem; color:#8899aa; text-align:right; line-height:1.6; }
  #map { flex:1; width:100%; }
  .legend { background:rgba(10,22,40,0.95); border:1px solid var(--gold); border-radius:6px; padding:14px 16px; font-family:"Source Sans 3",sans-serif; min-width:220px; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
  .legend h3 { font-family:"Playfair Display",serif; color:var(--gold); font-size:0.85rem; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid rgba(201,168,76,0.3); padding-bottom:6px; }
  .legend-item { display:flex; align-items:center; gap:9px; margin-bottom:7px; font-size:0.78rem; color:var(--cream); line-height:1.3; }
  .legend-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; border:2px solid rgba(255,255,255,0.3); }
  .legend-line { width:24px; height:3px; flex-shrink:0; border-radius:2px; }
  .legend-section { margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1); }
  .legend-note { font-size:0.7rem; color:#8899aa; margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1); line-height:1.6; }
  .legend-note a { color:var(--gold); text-decoration:none; }
  .leaflet-popup-content-wrapper { background:var(--navy); border:1px solid var(--gold); border-radius:6px; color:var(--cream); box-shadow:0 4px 20px rgba(0,0,0,0.6); }
  .leaflet-popup-tip { background:var(--navy); }
  .leaflet-popup-content { margin:14px 16px; font-family:"Source Sans 3",sans-serif; }
  .popup-title { font-family:"Playfair Display",serif; color:var(--gold); font-size:0.95rem; margin-bottom:5px; line-height:1.3; }
  .popup-tag { display:inline-block; font-size:0.65rem; padding:2px 7px; border-radius:10px; margin-bottom:7px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; }
  .popup-body { font-size:0.78rem; color:#ccd; line-height:1.5; }
  .popup-cost { margin-top:6px; font-size:0.72rem; font-weight:600; letter-spacing:0.04em; }
</style>
